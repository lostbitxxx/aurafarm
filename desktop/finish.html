<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Finish</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 8px 12px;
        background: #c6ef4a;
        color: #14211a;
        font: 600 13px/1.2 "Avenir Next", "Segoe UI", sans-serif;
        cursor: pointer;
      }
      p {
        margin: 0;
        padding: 0 8px;
        color: #f7f3e8;
        font-size: 11px;
        line-height: 1.3;
        text-shadow: 0 1px 2px #10241c;
      }
    </style>
  </head>
  <body>
    <button id="finish" type="button">Finish focused session</button>
    <p id="note"></p>
    <script src="finish.js"></script>
  </body>
</html>
