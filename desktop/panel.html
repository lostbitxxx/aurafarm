<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aurafarm</title>
    <style>
      html,
      body {
        height: 100%;
        background: transparent;
      }
      body {
        margin: 0;
        display: flex;
        height: 100%;
        overflow: hidden;
        font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.45;
        background: #f7f3e8;
        color: #23392d;
      }
      #panel-toggle {
        display: grid;
        place-items: center;
        flex: none;
        width: 24px;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        background: #f7f3e8;
        color: #23392d;
        font: 600 22px/1 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        cursor: pointer;
      }
      #panel-toggle:focus-visible {
        outline: 3px solid #8261a7;
        outline-offset: -3px;
      }
      #panel-body {
        display: none;
        flex: 1;
        min-width: 0;
        overflow: auto;
        padding: 16px 16px 16px 12px;
      }
      body.is-open #panel-body {
        display: grid;
        gap: 0.75rem;
        align-content: start;
      }
      form,
      p {
        margin: 0;
      }
      label {
        display: grid;
        gap: 0.35rem;
        font-weight: 500;
        color: #23392d;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #9daa90;
        border-radius: 14px;
        padding: 0.8rem 0.9rem;
        font: inherit;
        color: #23392d;
        background: #fffdf6;
      }
      textarea {
        min-height: 5.5rem;
        resize: none;
      }
      input:focus,
      textarea:focus {
        outline: 3px solid #8261a7;
        outline-offset: 3px;
      }
      #panel-body button {
        display: block;
        width: 100%;
        margin: 0;
        border-radius: 999px;
        padding: 0.85rem 1.2rem;
        font: 600 1rem/1.2 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        cursor: pointer;
      }
      #panel-body button:hover {
        filter: brightness(0.97);
      }
      #panel-body button:focus-visible {
        outline: 3px solid #8261a7;
        outline-offset: 3px;
      }
      #panel-body button.primary,
      #panel-body button.finish {
        background: #c5ef47;
        color: #23392d;
        border: 1px solid #97b839;
      }
      #panel-body button.ghost {
        background: #f5f0e2;
        color: #23392d;
        border: 1px solid #9daa90;
      }
      #note,
      #bubble,
      #status,
      #update-label {
        color: #596650;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body" aria-label="Open Aurafarm">‹</button>
    <div id="panel-body">
      <form id="session-token">
        <label>Session token <textarea name="token" autocomplete="off" required></textarea></label>
        <button class="primary" type="submit">Use session token</button>
      </form>
      <p id="update" hidden>
        <span id="update-label"></span>
        <button id="update-button" class="primary" type="button">Download update</button>
      </p>
      <p id="status">Paste a session token.</p>
      <p id="bubble" hidden></p>
      <button id="finish" class="finish" type="button">Finish focused session</button>
      <p id="note"></p>
      <button id="cancel" class="ghost" type="button">Cancel study session</button>
      <button id="quit" class="ghost" type="button">Quit</button>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
