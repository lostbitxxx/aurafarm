<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aurafarm</title>
    <style>
      html {
        font-size: 13px;
      }
      html,
      body {
        height: 100%;
        background: transparent;
      }
      body {
        --shell-cream: #f7f3e8;
        --shell-border: #9daa90;
        --session-green: #5fbf4a;
        --cylinder-wall: #fffcf7;
        --cylinder-edge: #c5ceb5;
        --cylinder-track: #e8ebe0;
        --shell-ink: #23392d;
        --shell-radius: 10px;
        margin: 0;
        box-sizing: border-box;
        height: 100%;
        overflow: hidden;
        padding: 0;
        font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        font-size: 1rem;
        line-height: 1.35;
        background: transparent;
        color: var(--shell-ink);
      }
      /* Closed window: only the rail capsule. Open frame: cream shell clipped, then expands. */
      #shell {
        position: relative;
        display: flex;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        color: var(--shell-ink);
        transition: clip-path 240ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.is-frame-open {
        padding: 3px;
      }
      body.is-frame-open #shell {
        border: 1.5px solid var(--shell-border);
        border-radius: var(--shell-radius);
        background: var(--shell-cream);
      }
      /* Rail strip while the OS window is already open-sized (before/after content open). */
      body.edge-right.is-frame-open:not(.is-open) #shell {
        clip-path: inset(0 0 0 calc(100% - 25px));
      }
      body.edge-left.is-frame-open:not(.is-open) #shell {
        clip-path: inset(0 calc(100% - 25px) 0 0);
      }
      body.edge-top.is-frame-open:not(.is-open) #shell {
        clip-path: inset(0 0 calc(100% - 25px) 0);
      }
      body.edge-bottom.is-frame-open:not(.is-open) #shell {
        clip-path: inset(calc(100% - 25px) 0 0 0);
      }
      body.is-frame-open.is-open #shell {
        clip-path: inset(0);
      }
      @media (prefers-reduced-motion: reduce) {
        #shell {
          transition: none;
        }
      }
      body.edge-left #shell,
      body.edge-right #shell {
        flex-direction: row;
      }
      body.edge-right #shell {
        flex-direction: row-reverse;
      }
      body.edge-top #shell,
      body.edge-bottom #shell {
        flex-direction: column;
      }
      body.edge-bottom #shell {
        flex-direction: column-reverse;
      }
      #dock-rail {
        position: relative;
        z-index: 1;
        display: flex;
        flex: none;
        align-items: stretch;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        background: transparent;
        color: var(--shell-ink);
        cursor: grab;
        user-select: none;
        touch-action: none;
      }
      #dock-rail.is-dragging {
        cursor: grabbing;
      }
      body.edge-left #dock-rail,
      body.edge-right #dock-rail {
        flex-direction: column;
        width: 25px;
        max-width: 100%;
        height: 100%;
      }
      body.edge-top #dock-rail,
      body.edge-bottom #dock-rail {
        flex-direction: row;
        width: 100%;
        height: 25px;
        max-height: 100%;
      }
      #panel-toggle {
        position: relative;
        display: block;
        flex: 1;
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: transparent;
        cursor: inherit;
      }
      #panel-body button {
        cursor: pointer;
        touch-action: manipulation;
      }
      body.edge-left #panel-toggle,
      body.edge-right #panel-toggle {
        width: 100%;
      }
      body.edge-top #panel-toggle,
      body.edge-bottom #panel-toggle {
        height: 100%;
      }
      #panel-toggle:focus-visible {
        outline: 3px solid #8261a7;
        outline-offset: -3px;
      }
      /* Expand / collapse hint: centered on the progress rail; flips when open. */
      #panel-chevron {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: var(--shell-ink);
        opacity: 0.62;
      }
      #panel-chevron svg {
        display: block;
        width: 11px;
        height: 11px;
        transition: transform 180ms ease;
      }
      /* Closed: point into the content (expand). Open: opposite (collapse). */
      body.edge-right #panel-chevron svg {
        transform: rotate(180deg);
      }
      body.edge-right.is-open #panel-chevron svg {
        transform: rotate(0deg);
      }
      body.edge-left #panel-chevron svg {
        transform: rotate(0deg);
      }
      body.edge-left.is-open #panel-chevron svg {
        transform: rotate(180deg);
      }
      body.edge-top #panel-chevron svg {
        transform: rotate(90deg);
      }
      body.edge-top.is-open #panel-chevron svg {
        transform: rotate(-90deg);
      }
      body.edge-bottom #panel-chevron svg {
        transform: rotate(-90deg);
      }
      body.edge-bottom.is-open #panel-chevron svg {
        transform: rotate(90deg);
      }
      @media (prefers-reduced-motion: reduce) {
        #panel-chevron svg {
          transition: none;
        }
      }
      /* One capsule = the rail bar (fill + tick lines). */
      #session-capsule {
        position: absolute;
        inset: 0;
        z-index: 0;
        box-sizing: border-box;
        overflow: hidden;
        border: 2px solid var(--cylinder-edge);
        border-radius: 999px;
        background: var(--cylinder-wall);
        box-shadow: none;
        pointer-events: none;
      }
      body.is-frame-open.edge-left #session-capsule,
      body.is-frame-open.edge-right #session-capsule {
        top: 3px;
        bottom: 3px;
        left: 2px;
        right: 2px;
      }
      body.is-frame-open.edge-top #session-capsule,
      body.is-frame-open.edge-bottom #session-capsule {
        left: 3px;
        right: 3px;
        top: 2px;
        bottom: 2px;
      }
      #session-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background: var(--session-green);
        border-radius: 0 0 999px 999px;
        pointer-events: none;
        transition: height 0.85s linear, width 0.85s linear;
      }
      body.edge-top #session-fill,
      body.edge-bottom #session-fill {
        top: 0;
        bottom: 0;
        right: auto;
        width: 0%;
        height: auto;
        border-radius: 999px 0 0 999px;
      }
      #session-ticks {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      #session-ticks span {
        position: absolute;
        background: rgba(35, 57, 45, 0.22);
      }
      /* Four ticks at 1/6, 2/6, 4/6, 5/6 — skip center so the chevron stays clear. */
      body.edge-left #session-ticks span,
      body.edge-right #session-ticks span {
        left: 15%;
        right: 15%;
        height: 1px;
      }
      body.edge-left #session-ticks span:nth-child(1),
      body.edge-right #session-ticks span:nth-child(1) {
        bottom: calc(100% / 6);
      }
      body.edge-left #session-ticks span:nth-child(2),
      body.edge-right #session-ticks span:nth-child(2) {
        bottom: calc(200% / 6);
      }
      body.edge-left #session-ticks span:nth-child(3),
      body.edge-right #session-ticks span:nth-child(3) {
        bottom: calc(400% / 6);
      }
      body.edge-left #session-ticks span:nth-child(4),
      body.edge-right #session-ticks span:nth-child(4) {
        bottom: calc(500% / 6);
      }
      body.edge-top #session-ticks span,
      body.edge-bottom #session-ticks span {
        top: 15%;
        bottom: 15%;
        width: 1px;
      }
      body.edge-top #session-ticks span:nth-child(1),
      body.edge-bottom #session-ticks span:nth-child(1) {
        left: calc(100% / 6);
      }
      body.edge-top #session-ticks span:nth-child(2),
      body.edge-bottom #session-ticks span:nth-child(2) {
        left: calc(200% / 6);
      }
      body.edge-top #session-ticks span:nth-child(3),
      body.edge-bottom #session-ticks span:nth-child(3) {
        left: calc(400% / 6);
      }
      body.edge-top #session-ticks span:nth-child(4),
      body.edge-bottom #session-ticks span:nth-child(4) {
        left: calc(500% / 6);
      }
      @media (prefers-reduced-motion: reduce) {
        #session-fill {
          transition: none;
        }
      }
      #panel-body {
        position: relative;
        display: flex;
        flex: 1 1 0;
        flex-direction: column;
        gap: 0.45rem;
        min-width: 0;
        min-height: 0;
        box-sizing: border-box;
        margin: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        padding: 0.55rem;
        overflow: auto;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 200ms ease, visibility 200ms ease;
      }
      body.edge-right #panel-body {
        padding-right: 0.35rem;
      }
      body.edge-left #panel-body {
        padding-left: 0.35rem;
      }
      body.is-open #panel-body {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        #panel-body {
          transition: none;
        }
      }
      #panel-stage {
        position: relative;
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.2rem;
        min-height: 0;
        padding: 0.15rem 0 0.35rem;
      }
      #session-clock {
        margin: 0;
        color: var(--shell-ink);
        font: 700 0.95rem/1.2 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      #session-clock:empty,
      #session-clock[hidden] {
        display: none;
      }
      #panel-pet {
        display: none;
        position: absolute;
        inset: 0;
        width: auto;
        height: auto;
        pointer-events: none;
      }
      body.is-open #panel-pet.is-visible {
        display: block;
      }
      .pet-chat {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: 100%;
        min-height: 2.2rem;
        max-width: 9.5rem;
        margin: 0 0 0.45rem;
        padding: 0.35rem 0.45rem;
        border: 1.5px solid #9daa90;
        border-radius: 4px;
        background: #fffdf6;
        color: #23392d;
        font: 650 10px/1.25 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        text-align: center;
        opacity: 0;
        transform-origin: 50% calc(100% + 7px);
        transform: scale(0.2);
        transition: opacity 180ms ease, transform 320ms cubic-bezier(0.16, 0.84, 0.24, 1);
      }
      .pet-chat.is-instant {
        transition: none;
      }
      .pet-chat::before,
      .pet-chat::after {
        content: "";
        position: absolute;
        left: 50%;
        width: 0;
        height: 0;
        pointer-events: none;
      }
      .pet-chat::before {
        bottom: -7px;
        margin-left: -7px;
        border-left: 7px solid transparent;
        border-right: 7px solid transparent;
        border-top: 7px solid #9daa90;
      }
      .pet-chat::after {
        bottom: -5px;
        margin-left: -5.5px;
        border-left: 5.5px solid transparent;
        border-right: 5.5px solid transparent;
        border-top: 5.5px solid #fffdf6;
      }
      #panel-pet .pet-chat {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(90px + 0.35rem + 0.45rem);
        width: min(100%, 9.5rem);
        margin: 0 auto;
      }
      .pet-chat.is-on {
        opacity: 1;
        transform: scale(1);
      }
      @media (prefers-reduced-motion: reduce) {
        .pet-chat {
          transition: none;
        }
      }
      #panel-pet-stack {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0.35rem;
        display: block;
        width: 90px;
        height: 90px;
        margin-inline: auto;
        flex: none;
        pointer-events: none;
        cursor: inherit;
      }
      #panel-pet-stack.is-study .pet-figure {
        inset: 8% 17% 28% 17%;
      }
      #panel-pet .pet-figure {
        position: absolute;
        inset: 0;
      }
      #panel-pet .pet-layer {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        image-rendering: pixelated;
        pointer-events: none;
        cursor: inherit;
      }
      /* Empty <img> without src draws a Chromium broken-image frame; keep layers hidden until set. */
      #panel-pet .pet-layer:not([src]),
      #panel-pet .pet-layer[hidden] {
        display: none;
      }
      #panel-actions {
        display: grid;
        gap: 0.45rem;
        flex: none;
        margin-top: auto;
        margin-bottom: 0;
      }
      #panel-actions #status,
      #panel-actions #note {
        font-size: 0.82rem;
      }
      #panel-actions #status {
        min-width: 0;
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
        line-height: 1.25;
      }
      #panel-action-row {
        display: grid;
        grid-template-columns: minmax(0, 1.85fr) minmax(3.25rem, 0.85fr);
        gap: 0.35rem;
        align-items: stretch;
      }
      #panel-action-row:not(:has(#finish:not([hidden]))) {
        grid-template-columns: 1fr;
      }
      #panel-body #panel-action-row #finish,
      #panel-body #panel-action-row #quit {
        width: 100%;
        min-width: 0;
      }
      p {
        margin: 0;
      }
      #panel-body button[hidden] {
        display: none;
      }
      #panel-body button {
        display: block;
        width: 100%;
        margin: 0;
        border-radius: 12px;
        padding: 0.5rem 0.85rem;
        font: 600 1rem/1.2 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        cursor: pointer;
      }
      #panel-body button:hover {
        filter: brightness(0.97);
      }
      #panel-body button:focus-visible {
        outline: 3px solid #8261a7;
        outline-offset: 3px;
      }
      #panel-body button.primary,
      #panel-body button.finish {
        background: #c5ef47;
        color: #23392d;
        border: 1px solid #97b839;
      }
      #panel-body button.ghost {
        background: #f5f0e2;
        color: #23392d;
        border: 1px solid #9daa90;
      }
      #note,
      #status,
      #update-label {
        color: #596650;
        line-height: 1.35;
      }
      #note:empty {
        display: none;
      }
    </style>
  </head>
  <body class="edge-right">
    <div id="shell">
      <div id="dock-rail">
        <button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body" aria-label="Open Aurafarm">
          <span id="session-capsule" aria-hidden="true">
            <span id="session-fill"></span>
            <span id="session-ticks">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </span>
          </span>
          <span id="panel-chevron" aria-hidden="true">
            <svg viewBox="0 0 12 12" focusable="false">
              <path
                d="M4.25 2.25 8.5 6 4.25 9.75"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
      </div>
      <div id="panel-body">
        <div id="panel-stage">
          <p id="session-clock" hidden></p>
          <div id="panel-pet" aria-hidden="true">
            <p id="panel-pet-chat" class="pet-chat"></p>
            <div id="panel-pet-stack">
              <img class="pet-layer is-floor" data-layer="floor" alt="" draggable="false" hidden />
              <img class="pet-layer is-chair" data-layer="chair" alt="" draggable="false" hidden />
              <span class="pet-figure">
                <img class="pet-layer is-shadow" data-layer="shadow" alt="" draggable="false" hidden />
                <img class="pet-layer is-legs" data-layer="legs" alt="" draggable="false" hidden />
                <img class="pet-layer is-body" data-layer="body" alt="" draggable="false" hidden />
                <img class="pet-layer is-face" data-layer="face" alt="" draggable="false" hidden />
              </span>
              <img class="pet-layer is-desk" data-layer="desk" alt="" draggable="false" hidden />
              <img class="pet-layer is-pen" data-layer="pen" alt="" draggable="false" hidden />
            </div>
          </div>
        </div>
        <div id="panel-actions">
          <p id="update" hidden>
            <span id="update-label"></span>
            <button id="update-button" class="primary" type="button">Download update</button>
          </p>
          <p id="status">Let's study together!</p>
          <p id="note"></p>
          <div id="panel-action-row">
            <button id="finish" class="finish" type="button" hidden>Finish session :)</button>
            <button id="quit" class="ghost" type="button">Quit</button>
          </div>
        </div>
      </div>
    </div>
    <script src="pet-art.js"></script>
    <script src="chat-motion.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
