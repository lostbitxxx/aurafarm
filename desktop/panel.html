<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aurafarm</title>
    <style>
      html {
        font-size: 13px;
      }
      html,
      body {
        height: 100%;
        background: transparent;
      }
      body {
        --shell-cream: #f7f3e8;
        --shell-border: #9daa90;
        --session-green: #5fbf4a;
        --session-study: #c43b2e;
        --session-rest: #3f78c8;
        --cylinder-wall: #fffcf7;
        --cylinder-edge: #c5ceb5;
        --cylinder-track: #e8ebe0;
        --shell-ink: #23392d;
        --shell-radius: 10px;
        --rail: 31px;
        --frame-pad: 8px;
        --peek: 112px;
        --session-distracted: #8a8f86;
        margin: 0;
        box-sizing: border-box;
        height: 100%;
        overflow: hidden;
        padding: 0;
        font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        font-size: 1rem;
        line-height: 1.35;
        background: transparent;
        color: var(--shell-ink);
      }
      /*
       * Closed: time bar only.
       * is-bounds-open: window is already the open size; the bar stays put.
       * is-frame-open: cream outline on that bar, slightly past it (--frame-pad).
       * is-open: cream extends sideways to full panel width.
       */
      #shell {
        position: relative;
        display: flex;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        color: var(--shell-ink);
        transition: clip-path 280ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.is-frame-open #shell {
        border: 1.5px solid var(--shell-border);
        border-radius: var(--shell-radius);
        background: var(--shell-cream);
      }
      /* Cream column stays on the docked edge until the sideways expand. */
      body.edge-left.is-bounds-open:not(.is-open) #shell,
      body.edge-right.is-bounds-open:not(.is-open) #shell {
        clip-path: inset(0 calc(100% - var(--rail)) 0 0);
      }
      body.edge-left.is-bounds-open:not(.is-open).is-peeking #shell,
      body.edge-right.is-bounds-open:not(.is-open).is-peeking #shell {
        clip-path: inset(0 calc(100% - var(--rail) - var(--peek)) 0 0);
      }
      body.edge-top.is-bounds-open:not(.is-open) #shell {
        clip-path: inset(0 0 calc(100% - var(--rail)) 0);
      }
      body.edge-top.is-bounds-open:not(.is-open).is-peeking #shell {
        clip-path: inset(0 0 calc(100% - var(--rail) - var(--peek)) 0);
      }
      body.edge-bottom.is-bounds-open:not(.is-open) #shell {
        clip-path: inset(calc(100% - var(--rail)) 0 0 0);
      }
      body.is-frame-open.is-open #shell {
        clip-path: inset(0);
      }
      @media (prefers-reduced-motion: reduce) {
        #shell {
          transition: none;
        }
      }
      body.edge-left #shell,
      body.edge-right #shell {
        flex-direction: row;
      }
      /* Same row layout as the left edge, mirrored so the bar stays on the right. */
      body.edge-right #shell {
        transform: scaleX(-1);
      }
      body.edge-right #dock-rail,
      body.edge-right #panel-body {
        transform: scaleX(-1);
      }
      /*
       * Do not scaleX #rail-peek — flipping that box around its center threw the
       * absolutely positioned pet off the rail. Shell scaleX already mirrors layout;
       * the stack/chat undo sprite/text mirror themselves.
       */
      body.edge-top #shell,
      body.edge-bottom #shell {
        flex-direction: column;
      }
      body.edge-bottom #shell {
        flex-direction: column-reverse;
      }
      #dock-rail {
        position: relative;
        z-index: 1;
        display: flex;
        flex: none;
        align-items: stretch;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        background: transparent;
        color: var(--shell-ink);
        cursor: grab;
        user-select: none;
        touch-action: none;
      }
      #dock-rail.is-dragging {
        cursor: grabbing;
      }
      body.is-study-day #dock-rail {
        background: #f3c2bc;
      }
      body.is-rest-day #dock-rail {
        background: #c5d7ee;
      }
      body.edge-left #dock-rail,
      body.edge-right #dock-rail {
        flex-direction: column;
        width: 31px;
        max-width: 100%;
        height: 100%;
      }
      body.edge-top #dock-rail,
      body.edge-bottom #dock-rail {
        flex-direction: row;
        width: 100%;
        height: 31px;
        max-height: 100%;
      }
      /* Open window is --frame-pad taller/longer. Keep the time bar the closed size, centered. */
      body.is-bounds-open.edge-left #dock-rail,
      body.is-bounds-open.edge-right #dock-rail {
        height: calc(100% - var(--frame-pad));
        align-self: center;
      }
      body.is-bounds-open.edge-top #dock-rail,
      body.is-bounds-open.edge-bottom #dock-rail {
        width: calc(100% - var(--frame-pad));
        align-self: center;
      }
      #panel-toggle {
        position: relative;
        display: block;
        flex: 1;
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: transparent;
        cursor: inherit;
      }
      #panel-body button {
        cursor: pointer;
        touch-action: manipulation;
      }
      body.edge-left #panel-toggle,
      body.edge-right #panel-toggle {
        width: 100%;
      }
      body.edge-top #panel-toggle,
      body.edge-bottom #panel-toggle {
        height: 100%;
      }
      #panel-toggle:focus-visible {
        outline: 3px solid #8261a7;
        outline-offset: -3px;
      }
      /* Expand / collapse hint: centered on the progress rail; flips when open. */
      #panel-chevron {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: var(--shell-ink);
        opacity: 0.62;
      }
      #panel-chevron svg {
        display: block;
        width: 11px;
        height: 11px;
        transition: transform 180ms ease;
      }
      /* Closed: point into the content (expand). Open: opposite (collapse). */
      body.edge-right #panel-chevron svg {
        transform: rotate(180deg);
      }
      body.edge-right.is-open #panel-chevron svg {
        transform: rotate(0deg);
      }
      body.edge-left #panel-chevron svg {
        transform: rotate(0deg);
      }
      body.edge-left.is-open #panel-chevron svg {
        transform: rotate(180deg);
      }
      body.edge-top #panel-chevron svg {
        transform: rotate(90deg);
      }
      body.edge-top.is-open #panel-chevron svg {
        transform: rotate(-90deg);
      }
      body.edge-bottom #panel-chevron svg {
        transform: rotate(-90deg);
      }
      body.edge-bottom.is-open #panel-chevron svg {
        transform: rotate(90deg);
      }
      @media (prefers-reduced-motion: reduce) {
        #panel-chevron svg {
          transition: none;
        }
      }
      /* One capsule = the rail bar (fill + tick lines). Study days tint it red, rest days blue. */
      #session-capsule {
        position: absolute;
        inset: 0;
        z-index: 0;
        box-sizing: border-box;
        overflow: hidden;
        border: 2px solid var(--cylinder-edge);
        border-radius: 999px;
        background: var(--cylinder-wall);
        box-shadow: none;
        pointer-events: none;
      }
      body.is-frame-open.edge-left #session-capsule,
      body.is-frame-open.edge-right #session-capsule {
        top: 0;
        bottom: 0;
        left: 2px;
        right: 2px;
      }
      body.is-frame-open.edge-top #session-capsule,
      body.is-frame-open.edge-bottom #session-capsule {
        left: 0;
        right: 0;
        top: 2px;
        bottom: 2px;
      }
      body.is-study-day #session-capsule {
        background: #f3c2bc;
      }
      body.is-rest-day #session-capsule {
        background: #c5d7ee;
      }
      #session-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background: var(--session-green);
        border-radius: 0 0 999px 999px;
        pointer-events: none;
        transition: height 0.85s linear, width 0.85s linear, background-color 0.35s linear;
      }
      body.is-study-day #session-fill {
        background: var(--session-study);
      }
      body.is-rest-day #session-fill {
        background: var(--session-rest);
      }
      body.is-distracted #session-fill {
        background: var(--session-distracted);
      }
      /* × marks on both ends of the capsule while a blocked site is up. */
      #session-marks {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: none;
        pointer-events: none;
        color: #4a5248;
        font: 700 11px/1 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      }
      body.is-distracted #session-marks {
        display: block;
      }
      #session-marks span {
        position: absolute;
        display: grid;
        place-items: center;
      }
      body.edge-left #session-marks span:first-child,
      body.edge-right #session-marks span:first-child {
        top: 2px;
        left: 0;
        right: 0;
      }
      body.edge-left #session-marks span:last-child,
      body.edge-right #session-marks span:last-child {
        bottom: 2px;
        left: 0;
        right: 0;
      }
      body.edge-top #session-marks span:first-child,
      body.edge-bottom #session-marks span:first-child {
        left: 2px;
        top: 0;
        bottom: 0;
      }
      body.edge-top #session-marks span:last-child,
      body.edge-bottom #session-marks span:last-child {
        right: 2px;
        top: 0;
        bottom: 0;
      }
      /* Closed-bar peek: pet head behind the rail, tilted out toward the desktop. */
      #rail-peek {
        position: absolute;
        z-index: 0;
        display: none;
        pointer-events: none;
      }
      body.is-peeking:not(.is-open) #rail-peek {
        display: block;
      }
      /*
       * Side docks: pet center sits on the content-facing white wall of the capsule,
       * near the bottom (slightly above the round end), then rotates ±45°.
       */
      body.edge-left #rail-peek,
      body.edge-right #rail-peek {
        top: auto;
        bottom: 22px;
        left: 0;
        width: calc(var(--rail) + var(--peek));
        height: 56px;
        margin: 0;
      }
      body.is-bounds-open.edge-left #rail-peek,
      body.is-bounds-open.edge-right #rail-peek {
        /* Open-sized window centers the shorter rail; match the capsule bottom. */
        bottom: calc(var(--frame-pad) / 2 + 22px);
      }
      /* Top dock: original peek below the rail (upside-down). */
      body.edge-top #rail-peek {
        top: var(--rail);
        bottom: auto;
        left: 50%;
        width: 7.5rem;
        height: var(--peek);
        margin-left: -3.75rem;
      }
      #rail-peek-chat {
        position: absolute;
        z-index: 2;
        max-width: 15rem;
        min-height: 2rem;
        margin: 0;
        padding: 0.34rem 0.48rem;
        font-size: 11px;
      }
      body.edge-left #rail-peek-chat,
      body.edge-right #rail-peek-chat {
        left: var(--rail);
        right: auto;
        bottom: calc(100% + 4px);
        width: 8.25rem;
        max-width: none;
      }
      /* Shell scaleX(-1) would mirror bubble text; undo on the bubble only. */
      body.edge-right #rail-peek-chat {
        transform: scaleX(-1);
        transform-origin: center center;
      }
      /* Tip points at the pet: left of bubble on left dock, right of bubble on right dock. */
      body.edge-left #rail-peek-chat::before,
      body.edge-left #rail-peek-chat::after {
        left: 16px;
      }
      body.edge-right #rail-peek-chat::before,
      body.edge-right #rail-peek-chat::after {
        left: auto;
        right: 16px;
        margin-left: 0;
      }
      body.edge-right #rail-peek-chat::before {
        margin-right: -7px;
      }
      body.edge-right #rail-peek-chat::after {
        margin-right: -5.5px;
      }
      /*
       * Top: bubble sits just under the upside-down pet (still inside the peek strip
       * so shell clip-path does not hide it). Tip centered, pointing up.
       */
      body.edge-top #rail-peek-chat {
        left: 50%;
        top: 56px;
        bottom: auto;
        width: 8.25rem;
        max-width: none;
        margin-left: -4.125rem;
        transform-origin: 50% 0;
      }
      body.edge-top #rail-peek-chat::before,
      body.edge-top #rail-peek-chat::after {
        top: -7px;
        bottom: auto;
        left: 50%;
        border-top: 0;
        border-left: 7px solid transparent;
        border-right: 7px solid transparent;
        border-bottom: 7px solid #9daa90;
      }
      body.edge-top #rail-peek-chat::before {
        margin-left: -7px;
      }
      body.edge-top #rail-peek-chat::after {
        top: -5px;
        margin-left: -5.5px;
        border-top: 0;
        border-left: 5.5px solid transparent;
        border-right: 5.5px solid transparent;
        border-bottom: 5.5px solid #fffdf6;
      }
      #rail-peek-stack {
        position: absolute;
        display: block;
        width: 52px;
        height: 52px;
        transform-origin: 50% 50%;
      }
      /* Half of 52px stack → center sits on the white wall at --rail. */
      body.edge-left #rail-peek-stack,
      body.edge-right #rail-peek-stack {
        left: calc(var(--rail) - 26px);
        bottom: 0;
      }
      body.edge-left #rail-peek-stack {
        transform: rotate(45deg);
      }
      /*
       * Right dock: same local anchor + rotate(45deg) as left. Shell scaleX(-1)
       * flips that into the opposite screen tilt; stack scaleX(-1) only un-mirrors
       * the sprite (does not move the rail-wall center).
       */
      body.edge-right #rail-peek-stack {
        transform: scaleX(-1) rotate(-45deg);
      }
      body.edge-top #rail-peek-stack {
        position: absolute;
        left: 50%;
        top: 2px;
        bottom: auto;
        margin-left: -26px;
        transform-origin: 50% 20%;
        transform: rotate(180deg);
      }
      #rail-peek .pet-figure {
        position: absolute;
        inset: 0;
      }
      #rail-peek .pet-layer {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        image-rendering: pixelated;
        pointer-events: none;
      }
      #rail-peek .pet-layer.is-legs { z-index: 1; }
      #rail-peek .pet-layer.is-body { z-index: 2; }
      #rail-peek .pet-layer.is-clothes { z-index: 3; }
      #rail-peek .pet-layer.is-face { z-index: 4; }
      #rail-peek .pet-layer.is-hat { z-index: 5; }
      #rail-peek .pet-layer.is-hat.is-head {
        top: -12%;
        right: auto;
        bottom: auto;
        left: 14%;
        width: 72%;
        height: 72%;
      }
      #rail-peek .pet-layer:not([src]),
      #rail-peek .pet-layer[hidden] {
        display: none;
      }
      .pet-chat strong {
        font-weight: 800;
        font-style: italic;
      }
      body.edge-top #session-fill,
      body.edge-bottom #session-fill {
        top: 0;
        bottom: 0;
        right: auto;
        width: 0%;
        height: auto;
        border-radius: 999px 0 0 999px;
      }
      #session-ticks {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      #session-ticks span {
        position: absolute;
        background: rgba(35, 57, 45, 0.22);
      }
      /* Four ticks at 1/6, 2/6, 4/6, 5/6 — skip center so the chevron stays clear. */
      body.edge-left #session-ticks span,
      body.edge-right #session-ticks span {
        left: 15%;
        right: 15%;
        height: 1px;
      }
      body.edge-left #session-ticks span:nth-child(1),
      body.edge-right #session-ticks span:nth-child(1) {
        bottom: calc(100% / 6);
      }
      body.edge-left #session-ticks span:nth-child(2),
      body.edge-right #session-ticks span:nth-child(2) {
        bottom: calc(200% / 6);
      }
      body.edge-left #session-ticks span:nth-child(3),
      body.edge-right #session-ticks span:nth-child(3) {
        bottom: calc(400% / 6);
      }
      body.edge-left #session-ticks span:nth-child(4),
      body.edge-right #session-ticks span:nth-child(4) {
        bottom: calc(500% / 6);
      }
      body.edge-top #session-ticks span,
      body.edge-bottom #session-ticks span {
        top: 15%;
        bottom: 15%;
        width: 1px;
      }
      body.edge-top #session-ticks span:nth-child(1),
      body.edge-bottom #session-ticks span:nth-child(1) {
        left: calc(100% / 6);
      }
      body.edge-top #session-ticks span:nth-child(2),
      body.edge-bottom #session-ticks span:nth-child(2) {
        left: calc(200% / 6);
      }
      body.edge-top #session-ticks span:nth-child(3),
      body.edge-bottom #session-ticks span:nth-child(3) {
        left: calc(400% / 6);
      }
      body.edge-top #session-ticks span:nth-child(4),
      body.edge-bottom #session-ticks span:nth-child(4) {
        left: calc(500% / 6);
      }
      @media (prefers-reduced-motion: reduce) {
        #session-fill {
          transition: none;
        }
      }
      #panel-body {
        position: relative;
        display: flex;
        flex: 1 1 0;
        flex-direction: column;
        gap: 0.45rem;
        min-width: 0;
        min-height: 0;
        box-sizing: border-box;
        margin: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        padding: 0.55rem;
        overflow: auto;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 200ms ease, visibility 200ms ease;
      }
      body.edge-right #panel-body {
        padding-right: 0.35rem;
      }
      body.edge-left #panel-body {
        padding-left: 0.35rem;
      }
      body.is-open #panel-body {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        #panel-body {
          transition: none;
        }
      }
      #panel-stage {
        position: relative;
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.2rem;
        min-height: 0;
        padding: 0.15rem 0 0.35rem;
      }
      #session-clock {
        position: relative;
        z-index: 3;
        flex: none;
        margin: 0 0 0.15rem;
        color: var(--shell-ink);
        font: 700 1.55rem/1.15 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      #session-clock:empty,
      #session-clock[hidden] {
        display: none;
      }
      #panel-pet {
        display: none;
        position: relative;
        flex: none;
        width: 100%;
        max-width: 9.5rem;
        margin: 0 auto;
        pointer-events: none;
      }
      body.is-open #panel-pet.is-visible {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .pet-chat {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: 100%;
        min-height: 2.35rem;
        max-width: 10.5rem;
        margin: 0 0 0.45rem;
        padding: 0.4rem 0.5rem;
        border: 1.5px solid #9daa90;
        border-radius: 4px;
        background: #fffdf6;
        color: #23392d;
        font: 650 11px/1.25 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        text-align: center;
        opacity: 0;
        transform-origin: 50% calc(100% + 7px);
        transform: scale(0.2);
        transition: opacity 180ms ease, transform 320ms cubic-bezier(0.16, 0.84, 0.24, 1);
      }
      .pet-chat.is-instant {
        transition: none;
      }
      .pet-chat::before,
      .pet-chat::after {
        content: "";
        position: absolute;
        left: 50%;
        width: 0;
        height: 0;
        pointer-events: none;
      }
      .pet-chat::before {
        bottom: -7px;
        margin-left: -7px;
        border-left: 7px solid transparent;
        border-right: 7px solid transparent;
        border-top: 7px solid #9daa90;
      }
      .pet-chat::after {
        bottom: -5px;
        margin-left: -5.5px;
        border-left: 5.5px solid transparent;
        border-right: 5.5px solid transparent;
        border-top: 5.5px solid #fffdf6;
      }
      #panel-pet .pet-chat {
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        width: min(100%, 10.5rem);
        margin: 0 0 0.35rem;
        order: 0;
      }
      .pet-chat.is-on {
        opacity: 1;
        transform: scale(1);
      }
      @media (prefers-reduced-motion: reduce) {
        .pet-chat {
          transition: none;
        }
      }
      #panel-pet-stack {
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        display: block;
        width: 90px;
        height: 90px;
        margin: 0 auto;
        flex: none;
        order: 1;
        pointer-events: none;
        cursor: inherit;
      }
      #panel-pet-stack.is-study .pet-figure {
        inset: 8% 17% 28% 17%;
      }
      #panel-pet .pet-figure {
        position: absolute;
        inset: 0;
      }
      #panel-pet .pet-layer {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        image-rendering: pixelated;
        pointer-events: none;
        cursor: inherit;
      }
      #panel-pet .pet-layer.is-legs { z-index: 1; }
      #panel-pet .pet-layer.is-body { z-index: 2; }
      #panel-pet .pet-layer.is-clothes { z-index: 3; }
      #panel-pet .pet-layer.is-face { z-index: 4; }
      #panel-pet .pet-layer.is-hat { z-index: 5; }
      #panel-pet .pet-layer.is-hat.is-head {
        top: -12%;
        right: auto;
        bottom: auto;
        left: 14%;
        width: 72%;
        height: 72%;
      }
      #panel-pet .pet-layer.is-desk { z-index: 6; }
      #panel-pet .pet-layer.is-pen { z-index: 7; }
      /* Empty <img> without src draws a Chromium broken-image frame; keep layers hidden until set. */
      #panel-pet .pet-layer:not([src]),
      #panel-pet .pet-layer[hidden] {
        display: none;
      }
      /* Float over the open panel; does not take layout space. */
      #keep-open {
        position: absolute;
        top: 0.4rem;
        right: 0.4rem;
        z-index: 5;
        display: none;
        align-items: center;
        gap: 0.32rem;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        font: 500 0.68rem/1 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        color: #8a9380;
      }
      body.is-open #keep-open {
        display: inline-flex;
      }
      #keep-open-label {
        pointer-events: none;
        user-select: none;
      }
      #keep-open-track {
        position: relative;
        display: block;
        box-sizing: border-box;
        width: 26px;
        height: 14px;
        border-radius: 999px;
        background: #d5d9ce;
        border: 1px solid #b7bfae;
        transition: background-color 160ms ease, border-color 160ms ease;
      }
      #keep-open-thumb {
        position: absolute;
        top: 1px;
        left: 1px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fffdf6;
        box-shadow: 0 0 0 1px rgba(35, 57, 45, 0.12);
        transition: transform 160ms ease;
      }
      #keep-open[aria-checked="true"] #keep-open-track {
        background: #c5ef47;
        border-color: #97b839;
      }
      #keep-open[aria-checked="true"] #keep-open-thumb {
        transform: translateX(12px);
      }
      #panel-actions {
        display: grid;
        gap: 0.45rem;
        flex: none;
        margin-top: auto;
        margin-bottom: 0;
      }
      #panel-actions #status,
      #panel-actions #note {
        font-size: 0.82rem;
      }
      #panel-actions #status {
        min-width: 0;
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
        line-height: 1.25;
      }
      #panel-action-row {
        display: grid;
        grid-template-columns: minmax(0, 1.85fr) minmax(3.25rem, 0.85fr);
        gap: 0.35rem;
        align-items: stretch;
      }
      #panel-action-row:not(:has(#finish:not([hidden]))) {
        grid-template-columns: 1fr;
      }
      #panel-body #panel-action-row #finish,
      #panel-body #panel-action-row #quit {
        width: 100%;
        min-width: 0;
      }
      p {
        margin: 0;
      }
      #panel-body button[hidden] {
        display: none;
      }
      #panel-body button {
        display: block;
        width: 100%;
        margin: 0;
        border-radius: 12px;
        padding: 0.5rem 0.85rem;
        font: 600 1rem/1.2 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        cursor: pointer;
      }
      #panel-body button:hover {
        filter: brightness(0.97);
      }
      #panel-body button:focus-visible {
        outline: 3px solid #8261a7;
        outline-offset: 3px;
      }
      /* Keep the corner switch tiny; undo the full-width action-button rules. */
      #panel-body #keep-open {
        display: none;
        width: auto;
        border-radius: 0;
        padding: 0;
        font: 500 0.68rem/1 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        background: transparent;
        border: 0;
        filter: none;
      }
      body.is-open #panel-body #keep-open {
        display: inline-flex;
      }
      #panel-body #keep-open:hover {
        filter: none;
      }
      #panel-body #keep-open:focus-visible {
        outline: 2px solid #8261a7;
        outline-offset: 2px;
        border-radius: 4px;
      }
      #panel-body button.primary,
      #panel-body button.finish {
        background: #c5ef47;
        color: #23392d;
        border: 1px solid #97b839;
      }
      #panel-body button.ghost {
        background: #f5f0e2;
        color: #23392d;
        border: 1px solid #9daa90;
      }
      #note,
      #status,
      #update-label {
        color: #596650;
        line-height: 1.35;
      }
      #note:empty {
        display: none;
      }
    </style>
  </head>
  <body class="edge-right">
    <div id="shell">
      <div id="dock-rail">
        <button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body" aria-label="Open Aurafarm">
          <span id="session-capsule" aria-hidden="true">
            <span id="session-fill"></span>
            <span id="session-ticks">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </span>
            <span id="session-marks" aria-hidden="true">
              <span>×</span>
              <span>×</span>
            </span>
          </span>
          <span id="panel-chevron" aria-hidden="true">
            <svg viewBox="0 0 12 12" focusable="false">
              <path
                d="M4.25 2.25 8.5 6 4.25 9.75"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
      </div>
      <div id="rail-peek" aria-hidden="true">
        <p id="rail-peek-chat" class="pet-chat"></p>
        <div id="rail-peek-stack">
          <span class="pet-figure">
            <img class="pet-layer is-legs" data-peek-layer="legs" alt="" draggable="false" hidden />
            <img class="pet-layer is-body" data-peek-layer="body" alt="" draggable="false" hidden />
            <img class="pet-layer is-clothes" data-peek-layer="clothes" alt="" draggable="false" hidden />
            <img class="pet-layer is-face" data-peek-layer="face" alt="" draggable="false" hidden />
            <img class="pet-layer is-hat" data-peek-layer="hat" alt="" draggable="false" hidden />
          </span>
        </div>
      </div>
      <div id="panel-body">
        <button
          id="keep-open"
          type="button"
          role="switch"
          aria-checked="false"
          title="Keep the bar open when the cursor leaves"
        >
          <span id="keep-open-label">toggle</span>
          <span id="keep-open-track" aria-hidden="true"><span id="keep-open-thumb"></span></span>
        </button>
        <div id="panel-stage">
          <p id="session-clock" hidden></p>
          <div id="panel-pet" aria-hidden="true">
            <p id="panel-pet-chat" class="pet-chat"></p>
            <div id="panel-pet-stack">
              <img class="pet-layer is-floor" data-layer="floor" alt="" draggable="false" hidden />
              <img class="pet-layer is-chair" data-layer="chair" alt="" draggable="false" hidden />
              <span class="pet-figure">
                <img class="pet-layer is-shadow" data-layer="shadow" alt="" draggable="false" hidden />
                <img class="pet-layer is-legs" data-layer="legs" alt="" draggable="false" hidden />
                <img class="pet-layer is-body" data-layer="body" alt="" draggable="false" hidden />
                <img class="pet-layer is-clothes" data-layer="clothes" alt="" draggable="false" hidden />
                <img class="pet-layer is-face" data-layer="face" alt="" draggable="false" hidden />
                <img class="pet-layer is-hat" data-layer="hat" alt="" draggable="false" hidden />
              </span>
              <img class="pet-layer is-desk" data-layer="desk" alt="" draggable="false" hidden />
              <img class="pet-layer is-pen" data-layer="pen" alt="" draggable="false" hidden />
            </div>
          </div>
        </div>
        <div id="panel-actions">
          <p id="update" hidden>
            <span id="update-label"></span>
            <button id="update-button" class="primary" type="button">Download update</button>
          </p>
          <p id="status">Let's study together!</p>
          <p id="note"></p>
          <div id="panel-action-row">
            <button id="finish" class="finish" type="button" hidden>Finish session :)</button>
            <button id="quit" class="ghost" type="button">Quit</button>
          </div>
        </div>
      </div>
    </div>
    <script src="pet-art.js"></script>
    <script src="chat-motion.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
