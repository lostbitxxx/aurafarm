<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aurafarm</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background: #10241c;
        color: #f7f3e8;
      }
      form,
      p {
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 13px;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 8px;
        font: inherit;
      }
      textarea {
        min-height: 72px;
        resize: none;
      }
      button {
        margin-top: 8px;
      }
      button.quit {
        margin-top: 16px;
      }
      #status {
        font-size: 13px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <form id="session-token">
      <label>Session token <textarea name="token" autocomplete="off" required></textarea></label>
      <button type="submit">Show pet</button>
    </form>
    <p id="update" hidden>
      <span id="update-label"></span>
      <button id="update-button" type="button">Download update</button>
    </p>
    <p id="status">Paste a session token to show the pet.</p>
    <button id="quit" class="quit" type="button">Quit</button>
    <script src="panel.js"></script>
  </body>
</html>
