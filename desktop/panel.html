<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aurafarm</title>
    <style>
      html {
        font-size: 13px;
      }
      html,
      body {
        height: 100%;
        background: transparent;
      }
      body {
        --shell-cream: #f7f3e8;
        --shell-border: #9daa90;
        --track-sage: #cfd6c6;
        --fill-purple: #9d8db8;
        --fill-band: rgba(55, 40, 78, 0.16);
        --shell-ink: #23392d;
        --shell-radius: 14px;
        margin: 0;
        box-sizing: border-box;
        height: 100%;
        overflow: hidden;
        padding: 6px;
        font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        font-size: 1rem;
        line-height: 1.35;
        background: transparent;
        color: var(--shell-ink);
      }
      /* One cream surface: the bar extends; no separate left card. */
      #shell {
        position: relative;
        display: flex;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        border: 1.5px solid var(--shell-border);
        border-radius: var(--shell-radius);
        background: var(--shell-cream);
        box-shadow: 2px 3px 0 rgba(35, 57, 45, 0.14);
        color: var(--shell-ink);
      }
      body.edge-left #shell,
      body.edge-right #shell {
        flex-direction: row;
      }
      body.edge-right #shell {
        flex-direction: row-reverse;
      }
      body.edge-top #shell,
      body.edge-bottom #shell {
        flex-direction: column;
      }
      body.edge-bottom #shell {
        flex-direction: column-reverse;
      }
      #dock-rail {
        position: relative;
        z-index: 1;
        display: flex;
        flex: none;
        align-items: center;
        box-sizing: border-box;
        margin: 0;
        background: transparent;
        color: var(--shell-ink);
      }
      body.edge-left #dock-rail,
      body.edge-right #dock-rail {
        flex-direction: column;
        width: 40px;
        height: 100%;
        padding: 6px 0;
      }
      body.edge-top #dock-rail,
      body.edge-bottom #dock-rail {
        flex-direction: row;
        width: 100%;
        height: 40px;
        padding: 0 6px;
      }
      #dock-handle {
        display: grid;
        place-items: center;
        flex: none;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--shell-ink);
        cursor: grab;
        -webkit-app-region: no-drag;
      }
      #dock-handle:active {
        cursor: grabbing;
      }
      #dock-handle:focus-visible {
        outline: 3px solid #8261a7;
        outline-offset: -3px;
      }
      body.edge-left #dock-handle,
      body.edge-right #dock-handle {
        width: 100%;
        height: 28px;
      }
      body.edge-top #dock-handle,
      body.edge-bottom #dock-handle {
        width: 28px;
        height: 100%;
      }
      #dock-handle svg {
        display: block;
        width: 12px;
        height: 12px;
        pointer-events: none;
      }
      #panel-toggle {
        position: relative;
        display: grid;
        place-items: center;
        flex: 1;
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: transparent;
        cursor: pointer;
      }
      body.edge-left #panel-toggle,
      body.edge-right #panel-toggle {
        width: 100%;
        padding: 4px 0;
      }
      body.edge-top #panel-toggle,
      body.edge-bottom #panel-toggle {
        height: 100%;
        padding: 0 4px;
      }
      #panel-toggle:focus-visible {
        outline: 3px solid #8261a7;
        outline-offset: -3px;
      }
      #exp-track {
        position: relative;
        display: block;
        overflow: hidden;
        border-radius: 8px;
        background: var(--track-sage);
        pointer-events: none;
      }
      body.edge-left #exp-track,
      body.edge-right #exp-track {
        width: 10px;
        height: 100%;
      }
      body.edge-top #exp-track,
      body.edge-bottom #exp-track {
        width: 100%;
        height: 10px;
      }
      #exp-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background-color: var(--fill-purple);
        background-image: repeating-linear-gradient(
          to top,
          transparent 0 9px,
          var(--fill-band) 9px 11px
        );
        pointer-events: none;
      }
      body.edge-top #exp-fill,
      body.edge-bottom #exp-fill {
        top: 0;
        bottom: 0;
        right: auto;
        width: 0%;
        height: auto;
        background-image: repeating-linear-gradient(
          to right,
          transparent 0 9px,
          var(--fill-band) 9px 11px
        );
      }
      #exp-level {
        display: grid;
        place-items: center;
        flex: none;
        min-width: 2.2em;
        color: var(--shell-ink);
        font: 650 10px/1.1 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
      }
      body.edge-left #exp-level,
      body.edge-right #exp-level {
        width: 100%;
        height: 24px;
      }
      body.edge-top #exp-level,
      body.edge-bottom #exp-level {
        width: auto;
        min-width: 2.4em;
        height: 100%;
        padding: 0 4px;
      }
      #panel-body {
        position: relative;
        display: flex;
        flex: 1 1 0;
        flex-direction: column;
        gap: 0.45rem;
        min-width: 0;
        min-height: 0;
        box-sizing: border-box;
        margin: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        padding: 0.55rem 0.55rem 0.55rem 0.55rem;
        overflow: auto;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 200ms ease, visibility 200ms ease;
      }
      body.edge-right #panel-body {
        padding-right: 0.35rem;
      }
      body.edge-left #panel-body {
        padding-left: 0.35rem;
      }
      body.is-open #panel-body {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        #panel-body {
          transition: none;
        }
      }
      #pet-switch-row {
        position: absolute;
        top: 0.4rem;
        right: 0.45rem;
        z-index: 1;
        display: flex;
        flex: none;
        align-items: center;
        justify-content: flex-end;
        gap: 0.45rem;
        margin: 0;
      }
      body.edge-right #pet-switch-row {
        right: 0.45rem;
      }
      #pet-switch-label {
        font-size: 0.92rem;
        font-weight: 550;
        color: #23392d;
      }
      #panel-body #pet-toggle {
        position: relative;
        display: block;
        flex: none;
        width: 26px;
        height: 16px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 16px;
        background: #e9e9eb;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      #panel-body #pet-toggle[aria-checked="true"] {
        background: #34c759;
      }
      #pet-switch-knob {
        position: absolute;
        top: 1px;
        left: 1px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.06);
        transition: transform 0.2s ease;
      }
      #panel-body #pet-toggle[aria-checked="true"] #pet-switch-knob {
        transform: translateX(10px);
      }
      #panel-body #pet-toggle:hover {
        filter: none;
      }
      #panel-body #pet-toggle:focus-visible {
        outline: 3px solid #8261a7;
        outline-offset: 3px;
      }
      #session-block {
        display: grid;
        gap: 0.45rem;
        margin-top: 0;
      }
      #panel-actions {
        display: grid;
        gap: 0.45rem;
        margin-top: auto;
        margin-bottom: 0;
      }
      form,
      p {
        margin: 0;
      }
      label {
        display: grid;
        gap: 0.25rem;
        font-weight: 500;
        color: #23392d;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #9daa90;
        border-radius: 12px;
        padding: 0.45rem 0.6rem;
        font: inherit;
        color: #23392d;
        background: #fffdf6;
      }
      textarea {
        min-height: 2.25rem;
        resize: none;
      }
      input:focus,
      textarea:focus {
        outline: 3px solid #8261a7;
        outline-offset: 3px;
      }
      #panel-body button:not(#pet-toggle)[hidden] {
        display: none;
      }
      #panel-body button:not(#pet-toggle) {
        display: block;
        width: 100%;
        margin: 0;
        border-radius: 12px;
        padding: 0.5rem 0.85rem;
        font: 600 1rem/1.2 "Outfit", "Avenir Next", "Segoe UI", sans-serif;
        cursor: pointer;
      }
      #panel-body #session-token button {
        margin-top: 0.7rem;
      }
      #panel-body button:not(#pet-toggle):hover {
        filter: brightness(0.97);
      }
      #panel-body button:not(#pet-toggle):focus-visible {
        outline: 3px solid #8261a7;
        outline-offset: 3px;
      }
      #panel-body button.primary,
      #panel-body button.finish {
        background: #c5ef47;
        color: #23392d;
        border: 1px solid #97b839;
      }
      #panel-body button.ghost {
        background: #f5f0e2;
        color: #23392d;
        border: 1px solid #9daa90;
      }
      #timer {
        position: absolute;
        top: 50%;
        left: 0.45rem;
        right: 0.45rem;
        transform: translateY(-50%);
        font-size: 2.9rem;
        font-weight: 650;
        line-height: 1.2;
        text-align: center;
        color: #23392d;
      }
      #note,
      #bubble,
      #status,
      #update-label {
        color: #596650;
        line-height: 1.35;
      }
      #note:empty {
        display: none;
      }
    </style>
  </head>
  <body class="edge-right">
    <div id="shell">
      <div id="dock-rail">
        <button id="dock-handle" type="button" aria-label="Move Aurafarm overlay" title="Move">
          <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 1.1v9.8M1.1 6h9.8M3.2 3.2 1.1 6l2.1 2.8M8.8 3.2 10.9 6 8.8 8.8M3.2 3.2 6 1.1l2.8 2.1M3.2 8.8 6 10.9l2.8-2.1"
            />
          </svg>
        </button>
        <button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body" aria-label="Open Aurafarm">
          <span id="exp-track"><span id="exp-fill"></span></span>
        </button>
        <span id="exp-level" aria-live="polite"></span>
      </div>
      <div id="panel-body">
        <div id="pet-switch-row">
          <span id="pet-switch-label">Show pet</span>
          <button id="pet-toggle" type="button" role="switch" aria-checked="true" aria-labelledby="pet-switch-label"><span id="pet-switch-knob"></span></button>
        </div>
        <div id="session-block">
          <form id="session-token">
            <label>Session token <textarea name="token" autocomplete="off" required></textarea></label>
            <button class="primary" type="submit">Use session token</button>
          </form>
          <p id="update" hidden>
            <span id="update-label"></span>
            <button id="update-button" class="primary" type="button">Download update</button>
          </p>
          <p id="timer" hidden></p>
          <p id="status">Paste a session token.</p>
          <p id="bubble" hidden></p>
        </div>
        <div id="panel-actions">
          <button id="finish" class="finish" type="button" hidden>Finish focused session</button>
          <p id="note"></p>
          <button id="quit" class="ghost" type="button">Quit</button>
        </div>
      </div>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
