<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aurafarm</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        height: 100%;
        overflow: hidden;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background: #10241c;
        color: #f7f3e8;
      }
      #panel-toggle {
        display: grid;
        place-items: center;
        flex: none;
        width: 40px;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: #f7f3e8;
        font: 600 22px/1 "Avenir Next", "Segoe UI", sans-serif;
        cursor: pointer;
      }
      body.is-open #panel-toggle {
        border-right: 1px solid rgba(247, 243, 232, 0.18);
      }
      #panel-body {
        display: none;
        flex: 1;
        min-width: 0;
        overflow: auto;
        padding: 16px 16px 16px 12px;
      }
      body.is-open #panel-body {
        display: block;
      }
      form,
      p {
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 13px;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 8px;
        font: inherit;
      }
      textarea {
        min-height: 72px;
        resize: none;
      }
      button {
        margin-top: 8px;
      }
      button.finish {
        display: block;
        border: 0;
        border-radius: 999px;
        padding: 8px 12px;
        background: #c6ef4a;
        color: #14211a;
        font: 600 13px/1.2 "Avenir Next", "Segoe UI", sans-serif;
        cursor: pointer;
      }
      #note,
      #bubble {
        font-size: 13px;
        line-height: 1.4;
      }
      button.quit {
        margin-top: 16px;
      }
      #status {
        font-size: 13px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body" aria-label="Open Aurafarm">‹</button>
    <div id="panel-body">
      <form id="session-token">
        <label>Session token <textarea name="token" autocomplete="off" required></textarea></label>
        <button type="submit">Use session token</button>
      </form>
      <p id="update" hidden>
        <span id="update-label"></span>
        <button id="update-button" type="button">Download update</button>
      </p>
      <p id="status">Paste a session token.</p>
      <p id="bubble" hidden></p>
      <button id="finish" class="finish" type="button">Finish focused session</button>
      <p id="note"></p>
      <button id="cancel" type="button">Cancel study session</button>
      <button id="quit" class="quit" type="button">Quit</button>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
